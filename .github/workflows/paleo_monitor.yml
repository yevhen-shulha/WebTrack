name: Paleo Festival Ticket Monitor

on:
  schedule:
      - cron: '5 5-19 * * *'
      - cron: '35 5-19 * * *'   # щогодини о :31 (08:31–22:31 за Цюрихом)
    
  workflow_dispatch:           # кнопка ручного запуску

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Zurich
      CHECK_INTERVAL: "0"
      ACTIVE_HOURS_ENABLED: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_ENABLED:    ${{ secrets.TELEGRAM_ENABLED }}
      TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFY_ALWAYS:       ${{ secrets.NOTIFY_ALWAYS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install playwright httpx
          playwright install chromium --with-deps

      - name: Run monitor
        run: python paleo_monitor.py
