name: Paleo Festival Ticket Monitor

on:
  schedule:
    - cron: '0 5-19 * * *'   # щогодини з 07:00 до 21:00 (UTC+2 = UTC 07–18)
  workflow_dispatch:           # кнопка ручного запуску

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Zurich
      CHECK_INTERVAL: "0"           # один запуск і вихід
      ACTIVE_HOURS_ENABLED: "false" # години контролює cron, не скрипт
      TELEGRAM_ENABLED:    ${{ secrets.TELEGRAM_ENABLED }}
      TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4.2.2
      
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright httpx
          playwright install chromium --with-deps

      - name: Run monitor
        run: python paleo_monitor.py
